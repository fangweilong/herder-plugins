[package]
name = "approval-helper"
version = "0.2.0"
edition = "2021"

[dependencies]
winit = "0.30"
softbuffer = "0.4"
tiny-skia = "0.11"
cosmic-text = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
fs2 = "0.4"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.19"
muda = "0.15"

# 只用于给 macOS 的 NSView.layer 设置圆角裁剪。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
